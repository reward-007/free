<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing Speed + CPS Test</title>
  <style>
    /* ===== Body & Background ===== */
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* ===== Container with Liquid Glass Effect ===== */
    .container {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    /* ===== Heading ===== */
    h1 {
      color: #fff;
      margin-bottom: 20px;
      text-shadow: 1px 1px 5px rgba(0,0,0,0.3);
    }

    /* ===== Textarea Styling ===== */
    textarea {
      width: 100%;
      border-radius: 15px;
      border: none;
      padding: 15px;
      font-size: 18px;
      resize: none;
      background: rgba(255, 255, 255, 0.3);
      color: #000;
      outline: none;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.1);
    }

    /* ===== Button ===== */
    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(10px);
      color: #000;
      transition: 0.3s;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.6);
    }

    /* ===== Stats Section ===== */
    .stats {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      color: #fff;
      font-weight: bold;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Typing Speed & CPS Test</h1>
    <textarea id="typingArea" placeholder="Start typing..." rows="5" disabled></textarea>
    <div class="stats">
      <p>Time: <span id="time">60</span>s</p>
      <p>Words: <span id="words">0</span></p>
      <p>CPS: <span id="cps">0</span></p>
    </div>
    <button id="startBtn">Start Test</button>
  </div>

  <script>
    let timeLeft = 60;
    let timer;
    let started = false;

    const typingArea = document.getElementById("typingArea");
    const timeDisplay = document.getElementById("time");
    const wordsDisplay = document.getElementById("words");
    const cpsDisplay = document.getElementById("cps");
    const startBtn = document.getElementById("startBtn");

    startBtn.addEventListener("click", () => {
      if (!started) {
        started = true;
        typingArea.disabled = false;
        typingArea.value = '';
        typingArea.focus();
        timeLeft = 60;
        timer = setInterval(updateTimer, 1000);
      }
    });

    function updateTimer() {
      if (timeLeft > 0) {
        timeLeft--;
        timeDisplay.textContent = timeLeft;
        updateStats();
      } else {
        clearInterval(timer);
        typingArea.disabled = true;
        updateStats();
        alert("Time's up! Your CPS: " + cpsDisplay.textContent);
      }
    }

    function updateStats() {
      const text = typingArea.value.trim();
      const words = text === "" ? 0 : text.split(/\s+/).length;
      const chars = text.length;
      wordsDisplay.textContent = words;
      cpsDisplay.textContent = ((chars) / (60 - timeLeft || 1)).toFixed(2);
    }
  </script>
</body>
</html>
